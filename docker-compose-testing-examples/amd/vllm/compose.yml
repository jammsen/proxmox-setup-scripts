# vLLM on AMD ROCm (Radeon / Ryzen AI APUs, gfx1150 / gfx1151 / gfx1152, RDNA dGPUs)
#
# Image: AMD's official RDNA build of vLLM (ROCm 7.14). Instinct/CDNA cards use the "cdna" tag instead.
# The image contains its own ROCm libraries with kernels for these GPU families - the LXC container only
# has to pass /dev/kfd and /dev/dri through (that is what scripts 031/032 set up).
#
# This is a testing compose file - the model and the memory settings are plain environment values
# below, change them right here in the file. For anything beyond testing, split configuration and
# secrets the way you normally do with compose.
#
# The scripts directory is mounted read-only into the container, so copy this folder somewhere
# writable before editing, e.g.:  cp -rT /root/proxmox-setup-scripts/docker-compose-testing-examples/amd/vllm /opt/vllm && cd /opt/vllm
#
# Start it with the gid of the "render" group of this container (owns /dev/kfd and /dev/dri/renderD*;
# the number differs between containers, that is why it is passed in):
#   RENDER_GID=$(getent group render | cut -d: -f3) bash -c "docker compose up -d && docker compose logs -f"
#
#   MODEL / GGUF_BASE_MODEL     Pick one of the two prepared options below (comment one in, one out):
#     Option 1 (default): Qwen3 4B Thinking as Q4_K_M GGUF from unsloth - about 2.5 GB of GPU memory, fits
#                         any GPU. GGUF models are given as "repo:QUANT" and need GGUF_BASE_MODEL pointing to
#                         the original (unquantized) model - vLLM takes the tokenizer and config.json from
#                         there (and runs in float16, GGUF weights do not support bfloat16). Note: vLLM's GGUF support is newer than its safetensors path and less
#                         exercised on ROCm - if it fails to start, use option 2.
#     Option 2:           the same model as full bf16 safetensors - about 8 GB for the weights plus KV cache,
#                         so plan ~10-12 GB of GPU memory. Standard vLLM path, best compatibility and speed.
#                         For other models: weights ~2 bytes x parameters in bf16 (7B ~14 GB), a Q4 GGUF
#                         ~0.6 bytes x parameters, plus the KV cache (KV_CACHE_GB below).
#   MAX_MODEL_LEN               Context length in tokens. Lower it if vLLM says the KV cache does not fit.
#   KV_CACHE_GB                 Memory for the KV cache in GB - an absolute amount, on purpose. vLLM's usual
#                               knob (--gpu-memory-utilization, a percentage) is meant for a dedicated GPU. On
#                               a Ryzen AI APU the "GPU memory" is system RAM shared with everything else on
#                               the Proxmox host (GTT, 96 GB after script 002), so a percentage would let vLLM
#                               grab tens of GB of host RAM and starve the other containers and VMs. 4 GB is
#                               plenty for a 4B model with 8k context (~70 requests in parallel); raise it on a
#                               dedicated GPU with free VRAM.
#   HF_TOKEN                    Only needed for gated models (Llama, Gemma, ...): https://huggingface.co/settings/tokens
#   (the names have no VLLM_ prefix on purpose - vLLM warns about every unknown VLLM_* variable)
#
# Models are downloaded into /opt/llm-models/huggingface - the shared model directory that scripts
# 031/032 mount from the Proxmox host (so several containers share the same downloads).
#
# The first start takes a while: after "Model loading took ..." vLLM compiles its kernels and captures
# CUDA graphs for the GPU (several minutes on an APU, no log output meanwhile - "amd-smi monitor -p -t -u -m -w 1"
# in a second shell shows the GPU at 100%). It is done when the log says "Application startup complete".
#
# API (OpenAI compatible) after start:  curl http://localhost:8000/v1/models
#   curl http://localhost:8000/v1/chat/completions -H 'Content-Type: application/json' \
#     -d '{"model":"unsloth/Qwen3-4B-Thinking-2507-GGUF:Q4_K_M","messages":[{"role":"user","content":"Say hello in one sentence."}],"max_tokens":200}'
# Logs:                                  docker compose logs -f
services:
    vllm-rocm:
        container_name: vllm-rocm
        image: rocm/vllm:rocm7.14.0_rdna_ubuntu24.04_py3.14_pytorch_2.11.0_vllm_0.23.0
        restart: unless-stopped
        ports:
            - 8000:8000
        devices:
            - /dev/kfd
            - /dev/dri
        environment:
            - HF_HOME=/opt/llm-models/huggingface
            - HF_TOKEN=
            # Option 1: Q4_K_M GGUF (~2.5 GB GPU memory)
            - MODEL=unsloth/Qwen3-4B-Thinking-2507-GGUF:Q4_K_M
            - GGUF_BASE_MODEL=Qwen/Qwen3-4B-Thinking-2507
            # Option 2: full bf16 safetensors (~10-12 GB GPU memory) - comment option 1 out and these two in
            #- MODEL=Qwen/Qwen3-4B-Thinking-2507
            #- GGUF_BASE_MODEL=
            - MAX_MODEL_LEN=8192
            - KV_CACHE_GB=4
        group_add:
            - video
            - "${RENDER_GID:-993}"   # gid of the "render" group inside this LXC: getent group render
        cap_add:
            - SYS_PTRACE
        security_opt:
            - seccomp=unconfined
        ipc: host
        shm_size: 8g
        volumes:
            - /opt/llm-models:/opt/llm-models
        command: >-
            sh -c 'vllm serve "$$MODEL"
            $${GGUF_BASE_MODEL:+--tokenizer "$$GGUF_BASE_MODEL" --hf-config-path "$$GGUF_BASE_MODEL" --dtype float16}
            --host 0.0.0.0 --port 8000
            --max-model-len "$$MAX_MODEL_LEN"
            --kv-cache-memory-bytes "$$((KV_CACHE_GB * 1024 * 1024 * 1024))"'
