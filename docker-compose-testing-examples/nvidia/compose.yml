# Models are stored in /opt/llm-models - the shared model directory that scripts 031/032 mount from the
# Proxmox host into this container (so several containers share the same models). If you did not
# choose that option, the directory is simply created inside the container on first start.
# Monitoring snippet:
# watch -d "docker exec ollama-main-gpu ollama list && echo \"\\nollama-main-gpu\\n\" && docker exec ollama-main-gpu ollama ps"
services:
    ollama-main-gpu:
        container_name: ollama-main-gpu
        image: ollama/ollama
        restart: unless-stopped
        ports:
            - 11434:11434
        environment:
            - OLLAMA_MODELS=/opt/llm-models
            - OLLAMA_NUM_PARALLEL=4
            #- OLLAMA_SCHED_SPREAD=1
            #- OLLAMA_MAX_LOADED_MODELS=3
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        volumes:
            - /opt/llm-models:/opt/llm-models
